name: verify-task5-reliability

on:
  push:
    branches:
      - task5/reliability

jobs:
  native-reliability:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout reliability branch
        uses: actions/checkout@v4

      - name: Bridge Rust format gate
        shell: pwsh
        run: rustfmt --edition 2021 --check native/src-tauri/src/bridge.rs

      - name: Provide Tauri frontendDist fixture
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path native/dist | Out-Null
          '<!doctype html><title>Task 5 reliability fixture</title>' | Set-Content -Path native/dist/index.html -Encoding utf8

      - name: Native tests
        shell: pwsh
        run: cargo test --manifest-path native/src-tauri/Cargo.toml
