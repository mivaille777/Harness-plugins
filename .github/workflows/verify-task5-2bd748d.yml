name: verify-task5-main

on:
  push:
    branches:
      - verify/task5-2bd748d

jobs:
  task5-windows-runtime:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      TASK5_MARKER: UIA_BROWSER_SELECTION_MAIN_122005F
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          ref: 122005f75af1fd7ae0621b626de6fe0072139732

      - name: Assert exact source commit and isolate Harness home
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne '122005f75af1fd7ae0621b626de6fe0072139732') {
            throw "Expected 122005f75af1fd7ae0621b626de6fe0072139732, got $actual"
          }
          "DSH_HOME=$env:RUNNER_TEMP\dsh-home" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Node 22.19
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      - name: Enable pnpm 11.7
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          node --version
          pnpm --version

      - name: Install workspace dependencies from main
        shell: pwsh
        run: pnpm install --no-frozen-lockfile

      - name: Gate - pnpm check on current main
        shell: pwsh
        run: pnpm check

      - name: Pack bundle
        shell: pwsh
        run: |
          pnpm pack
          $tgz = (Get-ChildItem -Path . -Filter 'dsh-selection-companion-*.tgz' | Select-Object -First 1).FullName
          if (-not $tgz) { throw 'pnpm pack did not create a tarball' }
          "DSH_TGZ=$tgz" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Packed: $tgz"

      - name: Build extensionless Native Companion before runtime gate
        shell: pwsh
        run: |
          pnpm --dir native build
          cargo build --manifest-path native/src-tauri/Cargo.toml
          $exe = (Resolve-Path 'native/src-tauri/target/debug/dsh-selection-companion-native.exe').Path
          "NATIVE_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Native companion: $exe"

      - name: Install DeepSeek Harness CLI with normal peer resolution
        shell: pwsh
        run: |
          npm install -g @deepseek-ai/dsh@latest
          dsh --version

      - name: Install tarball into web profile
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:DSH_HOME | Out-Null
          dsh plugin --profile web add "$env:DSH_TGZ"

      - name: Runtime E2E in one Windows shell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dshProc = $null
          $nativeProc = $null
          $chromeProc = $null
          $dshOut = Join-Path $pwd 'dsh-web.out.log'
          $dshErr = Join-Path $pwd 'dsh-web.err.log'
          $nativeOut = Join-Path $pwd 'native.out.log'
          $nativeErr = Join-Path $pwd 'native.err.log'

          function Probe-Harness([string]$label) {
            $probe = (node scripts/debug-selection.mjs 2>&1 | Out-String)
            if ($LASTEXITCODE -ne 0) {
              Write-Host "=== probe failed: $label ==="
              Write-Host $probe
              throw "Harness protocol probe failed: $label"
            }
            Write-Host "=== probe passed: $label ==="
            Write-Host $probe
            return $probe
          }

          try {
            $node = (Get-Command node.exe -ErrorAction Stop).Source
            $npmRoot = (npm root -g).Trim()
            $dshBin = Join-Path $npmRoot '@deepseek-ai\dsh\lib\bin.js'
            if (-not (Test-Path $dshBin)) { throw "DeepSeek Harness bin not found: $dshBin" }

            $dshProc = Start-Process -FilePath $node -ArgumentList @($dshBin, 'web', '--no-open') -RedirectStandardOutput $dshOut -RedirectStandardError $dshErr -PassThru
            Write-Host "Started dsh launcher PID=$($dshProc.Id)"

            $ready = $false
            $last = ''
            $deadline = (Get-Date).AddSeconds(90)
            while ((Get-Date) -lt $deadline -and -not $ready) {
              Start-Sleep -Milliseconds 500
              $last = (node scripts/debug-selection.mjs 2>&1 | Out-String)
              if ($LASTEXITCODE -eq 0 -and $last -match '\[debug-selection\] no current selection') {
                $ready = $true
              }
            }
            if (-not $ready) {
              Write-Host $last
              Get-Content $dshOut -ErrorAction SilentlyContinue
              Get-Content $dshErr -ErrorAction SilentlyContinue
              throw 'Harness bridge did not answer bridge.hello + selection.current within 90 seconds'
            }
            Write-Host 'Verified initial protocol-level named pipe'

            # Keep everything inside this same Actions step and prove that the
            # listener survives independently of step-boundary process cleanup.
            1..10 | ForEach-Object {
              Start-Sleep -Milliseconds 500
              Probe-Harness "pre-native stability $_/10" | Out-Null
            }
            Write-Host 'Verified named pipe remains stable for 5 seconds in the same shell before Native startup'

            $nativeProc = Start-Process -FilePath $env:NATIVE_EXE -RedirectStandardOutput $nativeOut -RedirectStandardError $nativeErr -PassThru
            Write-Host "Started Native Companion PID=$($nativeProc.Id)"
            Start-Sleep -Seconds 4
            if ($nativeProc.HasExited) {
              Get-Content $nativeOut -ErrorAction SilentlyContinue
              Get-Content $nativeErr -ErrorAction SilentlyContinue
              throw "Native companion exited early with code $($nativeProc.ExitCode)"
            }
            Probe-Harness 'after Native Companion startup' | Out-Null
            Write-Host 'Verified Harness bridge remains available with Native Companion running'

            $html = @"
            <!doctype html>
            <html><head><meta charset="utf-8"><title>Task5 UIA Probe</title></head>
            <body>
              <h1>Task 5 UIA Probe</h1>
              <div id="probe" contenteditable="true" tabindex="0">$env:TASK5_MARKER</div>
              <script>
                window.addEventListener('load', () => {
                  const el = document.getElementById('probe');
                  el.focus();
                  const node = el.firstChild;
                  const range = document.createRange();
                  range.setStart(node, 0);
                  range.collapse(true);
                  const sel = window.getSelection();
                  sel.removeAllRanges();
                  sel.addRange(range);
                });
              </script>
            </body></html>
            "@
            $htmlPath = Join-Path $pwd 'task5-uia-probe.html'
            Set-Content -Path $htmlPath -Value $html -Encoding utf8
            $url = ([System.Uri]$htmlPath).AbsoluteUri

            $chrome = Join-Path $env:ProgramFiles 'Google\Chrome\Application\chrome.exe'
            if (-not (Test-Path $chrome)) {
              $chrome = Join-Path ${env:ProgramFiles(x86)} 'Google\Chrome\Application\chrome.exe'
            }
            if (-not (Test-Path $chrome)) { throw 'Google Chrome not found on windows-latest runner' }

            $profile = Join-Path $env:RUNNER_TEMP 'chrome-task5-extensionless'
            $chromeProc = Start-Process -FilePath $chrome -ArgumentList @(
              "--user-data-dir=$profile",
              '--no-first-run',
              '--no-default-browser-check',
              '--disable-background-networking',
              '--disable-extensions',
              '--new-window',
              $url
            ) -PassThru
            Write-Host "Started extensionless Chrome PID=$($chromeProc.Id)"
            Start-Sleep -Seconds 5

            $shell = New-Object -ComObject WScript.Shell
            $activated = $false
            1..20 | ForEach-Object {
              if (-not $activated) {
                $activated = $shell.AppActivate($chromeProc.Id)
                if (-not $activated) { Start-Sleep -Milliseconds 250 }
              }
            }
            if (-not $activated) { throw 'Could not activate Chrome window for UIA selection probe' }
            Start-Sleep -Milliseconds 500

            1..$env:TASK5_MARKER.Length | ForEach-Object {
              $shell.SendKeys('+{RIGHT}')
              Start-Sleep -Milliseconds 20
            }

            $matched = $false
            $last = ''
            1..20 | ForEach-Object {
              if (-not $matched) {
                Start-Sleep -Milliseconds 500
                $last = (node scripts/debug-selection.mjs 2>&1 | Out-String)
                if ($LASTEXITCODE -eq 0 -and $last -match [regex]::Escape($env:TASK5_MARKER) -and $last -match '"provider"\s*:\s*"browser-accessibility"') {
                  $matched = $true
                }
              }
            }
            Write-Host $last
            if (-not $matched) {
              throw 'Chrome selection did not reach Harness as provider=browser-accessibility'
            }
            Write-Host 'Verified extensionless Chrome -> BrowserAccessibilityProvider -> named pipe -> ctx.selectionContext'
          }
          finally {
            Write-Host '=== dsh web stdout ==='
            Get-Content $dshOut -ErrorAction SilentlyContinue
            Write-Host '=== dsh web stderr ==='
            Get-Content $dshErr -ErrorAction SilentlyContinue
            Write-Host '=== native stdout ==='
            Get-Content $nativeOut -ErrorAction SilentlyContinue
            Write-Host '=== native stderr ==='
            Get-Content $nativeErr -ErrorAction SilentlyContinue
            foreach ($proc in @($chromeProc, $nativeProc, $dshProc)) {
              if ($null -ne $proc) {
                Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              }
            }
          }
