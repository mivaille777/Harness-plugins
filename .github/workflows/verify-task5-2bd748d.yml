name: verify-task5-2bd748d

on:
  push:
    branches:
      - verify/task5-2bd748d

jobs:
  task5-windows-runtime:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      TASK5_MARKER: UIA_BROWSER_SELECTION_2BD748D
    steps:
      - name: Checkout exact 2bd748d
        uses: actions/checkout@v4
        with:
          ref: 2bd748d51c18b6caaa9e02ef6429c44a4be4a1fa

      - name: Assert exact source commit and isolate Harness home
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne '2bd748d51c18b6caaa9e02ef6429c44a4be4a1fa') {
            throw "Expected 2bd748d51c18b6caaa9e02ef6429c44a4be4a1fa, got $actual"
          }
          "DSH_HOME=$env:RUNNER_TEMP\dsh-home" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Node 22.19
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      - name: Enable pnpm 11.7
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          node --version
          pnpm --version

      - name: Apply candidate pnpm 11 build policy
        shell: pwsh
        run: |
          @"
          packages:
            - native
            - browser-extension
          allowBuilds:
            esbuild: true
          "@ | Set-Content -Path pnpm-workspace.yaml -Encoding utf8
          Write-Host 'Candidate diff relative to 2bd748d:'
          git diff -- pnpm-workspace.yaml

      - name: Install workspace dependencies
        shell: pwsh
        run: pnpm install --no-frozen-lockfile

      - name: Gate - pnpm check with candidate Task 5 build-policy fix
        shell: pwsh
        run: pnpm check

      - name: Pack bundle
        shell: pwsh
        run: |
          pnpm pack
          $tgz = (Get-ChildItem -Path . -Filter 'dsh-selection-companion-*.tgz' | Select-Object -First 1).FullName
          if (-not $tgz) { throw 'pnpm pack did not create a tarball' }
          "DSH_TGZ=$tgz" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Packed: $tgz"

      - name: Install DeepSeek Harness CLI with normal peer resolution
        shell: pwsh
        run: |
          npm install -g @deepseek-ai/dsh@latest
          dsh --version

      - name: Install tarball into web profile
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:DSH_HOME | Out-Null
          dsh plugin --profile web add "$env:DSH_TGZ"

      - name: Start dsh web and prove named pipe is created
        shell: pwsh
        run: |
          $dsh = (Get-Command dsh.cmd -ErrorAction Stop).Source
          $stdout = Join-Path $pwd 'dsh-web.out.log'
          $stderr = Join-Path $pwd 'dsh-web.err.log'
          $proc = Start-Process -FilePath $dsh -ArgumentList @('web') -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          "DSH_PID=$($proc.Id)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $connected = $false
          $deadline = (Get-Date).AddSeconds(90)
          while ((Get-Date) -lt $deadline -and -not $connected) {
            $pipe = $null
            try {
              $pipe = [System.IO.Pipes.NamedPipeClientStream]::new('.', 'dsh-selection-companion-v1', [System.IO.Pipes.PipeDirection]::InOut)
              $pipe.Connect(500)
              $connected = $pipe.IsConnected
            } catch {
              Start-Sleep -Milliseconds 500
            } finally {
              if ($null -ne $pipe) { $pipe.Dispose() }
            }
          }

          Get-Content $stdout -ErrorAction SilentlyContinue
          Get-Content $stderr -ErrorAction SilentlyContinue
          if (-not $connected) {
            throw 'Named pipe \\.\pipe\dsh-selection-companion-v1 was not connectable within 90 seconds'
          }
          Write-Host 'Verified named pipe: \\.\pipe\dsh-selection-companion-v1'

      - name: Build extensionless Native Companion
        shell: pwsh
        run: |
          pnpm --dir native build
          cargo build --manifest-path native/src-tauri/Cargo.toml
          $exe = (Resolve-Path 'native/src-tauri/target/debug/dsh-selection-companion-native.exe').Path
          "NATIVE_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Native companion: $exe"

      - name: Start Native Companion
        shell: pwsh
        run: |
          $stdout = Join-Path $pwd 'native.out.log'
          $stderr = Join-Path $pwd 'native.err.log'
          $proc = Start-Process -FilePath $env:NATIVE_EXE -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          "NATIVE_PID=$($proc.Id)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Start-Sleep -Seconds 4
          if ($proc.HasExited) {
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
            throw "Native companion exited early with code $($proc.ExitCode)"
          }

      - name: Chrome extensionless UIA selection to ctx.selectionContext
        shell: pwsh
        run: |
          $html = @"
          <!doctype html>
          <html><head><meta charset="utf-8"><title>Task5 UIA Probe</title></head>
          <body>
            <h1>Task 5 UIA Probe</h1>
            <div id="probe" contenteditable="true" tabindex="0">$env:TASK5_MARKER</div>
            <script>
              window.addEventListener('load', () => {
                const el = document.getElementById('probe');
                el.focus();
                const node = el.firstChild;
                const range = document.createRange();
                range.setStart(node, 0);
                range.collapse(true);
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(range);
              });
            </script>
          </body></html>
          "@
          $htmlPath = Join-Path $pwd 'task5-uia-probe.html'
          Set-Content -Path $htmlPath -Value $html -Encoding utf8
          $url = ([System.Uri]$htmlPath).AbsoluteUri

          $chrome = Join-Path $env:ProgramFiles 'Google\Chrome\Application\chrome.exe'
          if (-not (Test-Path $chrome)) {
            $chrome = Join-Path ${env:ProgramFiles(x86)} 'Google\Chrome\Application\chrome.exe'
          }
          if (-not (Test-Path $chrome)) { throw 'Google Chrome not found on windows-latest runner' }

          $profile = Join-Path $env:RUNNER_TEMP 'chrome-task5-extensionless'
          $chromeProc = Start-Process -FilePath $chrome -ArgumentList @(
            "--user-data-dir=$profile",
            '--no-first-run',
            '--no-default-browser-check',
            '--disable-background-networking',
            '--new-window',
            $url
          ) -PassThru
          "CHROME_PID=$($chromeProc.Id)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Start-Sleep -Seconds 5

          $shell = New-Object -ComObject WScript.Shell
          $activated = $false
          1..20 | ForEach-Object {
            if (-not $activated) {
              $activated = $shell.AppActivate($chromeProc.Id)
              if (-not $activated) { Start-Sleep -Milliseconds 250 }
            }
          }
          if (-not $activated) { throw 'Could not activate Chrome window for UIA selection probe' }
          Start-Sleep -Milliseconds 500

          1..29 | ForEach-Object {
            $shell.SendKeys('+{RIGHT}')
            Start-Sleep -Milliseconds 20
          }

          $matched = $false
          $last = ''
          1..20 | ForEach-Object {
            if (-not $matched) {
              Start-Sleep -Milliseconds 500
              $last = (node scripts/debug-selection.mjs 2>&1 | Out-String)
              if ($last -match [regex]::Escape($env:TASK5_MARKER) -and $last -match '"provider"\s*:\s*"browser-accessibility"') {
                $matched = $true
              }
            }
          }
          Write-Host $last
          if (-not $matched) {
            Get-Content native.out.log -ErrorAction SilentlyContinue
            Get-Content native.err.log -ErrorAction SilentlyContinue
            throw 'Chrome selection did not reach Harness as provider=browser-accessibility'
          }
          Write-Host 'Verified extensionless Chrome -> BrowserAccessibilityProvider -> named pipe -> ctx.selectionContext'

      - name: Dump runtime logs
        if: always()
        shell: pwsh
        run: |
          Write-Host '=== dsh web stdout ==='
          Get-Content dsh-web.out.log -ErrorAction SilentlyContinue
          Write-Host '=== dsh web stderr ==='
          Get-Content dsh-web.err.log -ErrorAction SilentlyContinue
          Write-Host '=== native stdout ==='
          Get-Content native.out.log -ErrorAction SilentlyContinue
          Write-Host '=== native stderr ==='
          Get-Content native.err.log -ErrorAction SilentlyContinue

      - name: Cleanup processes
        if: always()
        shell: pwsh
        run: |
          foreach ($name in @('CHROME_PID','NATIVE_PID','DSH_PID')) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($value) {
              Stop-Process -Id ([int]$value) -Force -ErrorAction SilentlyContinue
            }
          }
