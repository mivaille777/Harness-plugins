name: verify-task5-main

on:
  push:
    branches:
      - verify/task5-2bd748d

jobs:
  task5-windows-runtime:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      TASK5_MARKER: UIA_BROWSER_SELECTION_MAIN_122005F
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          ref: 122005f75af1fd7ae0621b626de6fe0072139732

      - name: Assert exact source commit and isolate Harness home
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne '122005f75af1fd7ae0621b626de6fe0072139732') {
            throw "Expected 122005f75af1fd7ae0621b626de6fe0072139732, got $actual"
          }
          "DSH_HOME=$env:RUNNER_TEMP\dsh-home" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Node 22.19
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      - name: Enable pnpm 11.7
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          node --version
          pnpm --version

      - name: Install workspace dependencies from main
        shell: pwsh
        run: pnpm install --no-frozen-lockfile

      - name: Gate - pnpm check on current main
        shell: pwsh
        run: pnpm check

      - name: Pack bundle
        shell: pwsh
        run: |
          pnpm pack
          $tgz = (Get-ChildItem -Path . -Filter 'dsh-selection-companion-*.tgz' | Select-Object -First 1).FullName
          if (-not $tgz) { throw 'pnpm pack did not create a tarball' }
          "DSH_TGZ=$tgz" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Packed: $tgz"

      - name: Build extensionless Native Companion before runtime gate
        shell: pwsh
        run: |
          pnpm --dir native build
          cargo build --manifest-path native/src-tauri/Cargo.toml
          $exe = (Resolve-Path 'native/src-tauri/target/debug/dsh-selection-companion-native.exe').Path
          "NATIVE_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Native companion: $exe"

      - name: Install DeepSeek Harness CLI with normal peer resolution
        shell: pwsh
        run: |
          npm install -g @deepseek-ai/dsh@latest
          dsh --version

      - name: Install tarball into web profile
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:DSH_HOME | Out-Null
          dsh plugin --profile web add "$env:DSH_TGZ"

      - name: Start actual dsh Node process and prove protocol-level named pipe
        shell: pwsh
        run: |
          $node = (Get-Command node.exe -ErrorAction Stop).Source
          $npmRoot = (npm root -g).Trim()
          $dshBin = Join-Path $npmRoot '@deepseek-ai\dsh\lib\bin.js'
          if (-not (Test-Path $dshBin)) { throw "DeepSeek Harness bin not found: $dshBin" }

          $stdout = Join-Path $pwd 'dsh-web.out.log'
          $stderr = Join-Path $pwd 'dsh-web.err.log'
          $proc = Start-Process -FilePath $node -ArgumentList @($dshBin, 'web', '--no-open') -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          "DSH_PID=$($proc.Id)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Started actual dsh Node process PID=$($proc.Id)"

          $ready = $false
          $last = ''
          $deadline = (Get-Date).AddSeconds(90)
          while ((Get-Date) -lt $deadline -and -not $ready) {
            if ($proc.HasExited) {
              Get-Content $stdout -ErrorAction SilentlyContinue
              Get-Content $stderr -ErrorAction SilentlyContinue
              throw "actual dsh Node process exited before the bridge became ready, code=$($proc.ExitCode)"
            }
            Start-Sleep -Milliseconds 500
            $last = (node scripts/debug-selection.mjs 2>&1 | Out-String)
            if ($LASTEXITCODE -eq 0 -and $last -match '\[debug-selection\] no current selection') {
              $ready = $true
            }
          }

          Get-Content $stdout -ErrorAction SilentlyContinue
          Get-Content $stderr -ErrorAction SilentlyContinue
          if (-not $ready) {
            Write-Host $last
            throw 'Harness bridge did not answer a valid bridge.hello + selection.current probe within 90 seconds'
          }
          if ($proc.HasExited) { throw "actual dsh Node process exited immediately after readiness, code=$($proc.ExitCode)" }
          Write-Host 'Verified protocol-level named pipe: \\.\pipe\dsh-selection-companion-v1'

      - name: Start Native Companion and verify Harness coexistence
        shell: pwsh
        run: |
          $dshProc = Get-Process -Id ([int]$env:DSH_PID) -ErrorAction SilentlyContinue
          if (-not $dshProc) {
            Get-Content dsh-web.out.log -ErrorAction SilentlyContinue
            Get-Content dsh-web.err.log -ErrorAction SilentlyContinue
            throw 'actual dsh Node process is no longer alive before Native Companion startup'
          }

          $before = (node scripts/debug-selection.mjs 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) {
            Write-Host $before
            throw 'Harness protocol probe failed immediately before Native Companion startup'
          }
          Write-Host $before

          $stdout = Join-Path $pwd 'native.out.log'
          $stderr = Join-Path $pwd 'native.err.log'
          $proc = Start-Process -FilePath $env:NATIVE_EXE -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          "NATIVE_PID=$($proc.Id)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Start-Sleep -Seconds 4
          if ($proc.HasExited) {
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
            throw "Native companion exited early with code $($proc.ExitCode)"
          }
          if (-not (Get-Process -Id ([int]$env:DSH_PID) -ErrorAction SilentlyContinue)) {
            throw 'actual dsh Node process exited after Native Companion startup'
          }

          $after = (node scripts/debug-selection.mjs 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) {
            Write-Host $after
            throw 'Harness named pipe became unavailable after Native Companion startup'
          }
          Write-Host $after
          Write-Host 'Verified Harness bridge remains available with Native Companion running'

      - name: Chrome extensionless UIA selection to ctx.selectionContext
        shell: pwsh
        run: |
          $dshProc = Get-Process -Id ([int]$env:DSH_PID) -ErrorAction SilentlyContinue
          if (-not $dshProc) { throw 'actual dsh Node process died before Chrome UIA E2E' }
          $nativeProc = Get-Process -Id ([int]$env:NATIVE_PID) -ErrorAction SilentlyContinue
          if (-not $nativeProc) { throw 'Native Companion died before Chrome UIA E2E' }

          $html = @"
          <!doctype html>
          <html><head><meta charset="utf-8"><title>Task5 UIA Probe</title></head>
          <body>
            <h1>Task 5 UIA Probe</h1>
            <div id="probe" contenteditable="true" tabindex="0">$env:TASK5_MARKER</div>
            <script>
              window.addEventListener('load', () => {
                const el = document.getElementById('probe');
                el.focus();
                const node = el.firstChild;
                const range = document.createRange();
                range.setStart(node, 0);
                range.collapse(true);
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(range);
              });
            </script>
          </body></html>
          "@
          $htmlPath = Join-Path $pwd 'task5-uia-probe.html'
          Set-Content -Path $htmlPath -Value $html -Encoding utf8
          $url = ([System.Uri]$htmlPath).AbsoluteUri

          $chrome = Join-Path $env:ProgramFiles 'Google\Chrome\Application\chrome.exe'
          if (-not (Test-Path $chrome)) {
            $chrome = Join-Path ${env:ProgramFiles(x86)} 'Google\Chrome\Application\chrome.exe'
          }
          if (-not (Test-Path $chrome)) { throw 'Google Chrome not found on windows-latest runner' }

          $profile = Join-Path $env:RUNNER_TEMP 'chrome-task5-extensionless'
          $chromeProc = Start-Process -FilePath $chrome -ArgumentList @(
            "--user-data-dir=$profile",
            '--no-first-run',
            '--no-default-browser-check',
            '--disable-background-networking',
            '--disable-extensions',
            '--new-window',
            $url
          ) -PassThru
          "CHROME_PID=$($chromeProc.Id)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Start-Sleep -Seconds 5

          $shell = New-Object -ComObject WScript.Shell
          $activated = $false
          1..20 | ForEach-Object {
            if (-not $activated) {
              $activated = $shell.AppActivate($chromeProc.Id)
              if (-not $activated) { Start-Sleep -Milliseconds 250 }
            }
          }
          if (-not $activated) { throw 'Could not activate Chrome window for UIA selection probe' }
          Start-Sleep -Milliseconds 500

          1..$env:TASK5_MARKER.Length | ForEach-Object {
            $shell.SendKeys('+{RIGHT}')
            Start-Sleep -Milliseconds 20
          }

          $matched = $false
          $last = ''
          1..20 | ForEach-Object {
            if (-not $matched) {
              Start-Sleep -Milliseconds 500
              $last = (node scripts/debug-selection.mjs 2>&1 | Out-String)
              if ($LASTEXITCODE -eq 0 -and $last -match [regex]::Escape($env:TASK5_MARKER) -and $last -match '"provider"\s*:\s*"browser-accessibility"') {
                $matched = $true
              }
            }
          }
          Write-Host $last
          if (-not $matched) {
            Get-Content dsh-web.out.log -ErrorAction SilentlyContinue
            Get-Content dsh-web.err.log -ErrorAction SilentlyContinue
            Get-Content native.out.log -ErrorAction SilentlyContinue
            Get-Content native.err.log -ErrorAction SilentlyContinue
            throw 'Chrome selection did not reach Harness as provider=browser-accessibility'
          }
          Write-Host 'Verified extensionless Chrome -> BrowserAccessibilityProvider -> named pipe -> ctx.selectionContext'

      - name: Dump runtime logs
        if: always()
        shell: pwsh
        run: |
          Write-Host '=== dsh web stdout ==='
          Get-Content dsh-web.out.log -ErrorAction SilentlyContinue
          Write-Host '=== dsh web stderr ==='
          Get-Content dsh-web.err.log -ErrorAction SilentlyContinue
          Write-Host '=== native stdout ==='
          Get-Content native.out.log -ErrorAction SilentlyContinue
          Write-Host '=== native stderr ==='
          Get-Content native.err.log -ErrorAction SilentlyContinue

      - name: Cleanup processes
        if: always()
        shell: pwsh
        run: |
          foreach ($name in @('CHROME_PID','NATIVE_PID','DSH_PID')) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($value) {
              Stop-Process -Id ([int]$value) -Force -ErrorAction SilentlyContinue
            }
          }
