name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/t05-session-integration

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:ec07:model-boundary:unit
      - run: pnpm test:ec08:session-model-boundary:unit
      - run: pnpm test:ec09:driver-contract

  windows-native:
    name: Windows native
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:task5
      - run: cargo fmt --manifest-path native/src-tauri/Cargo.toml -- --check
