name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/t05-session-integration

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:ec07:model-boundary:unit
      - run: pnpm test:ec08:session-model-boundary:unit
      - run: pnpm test:ec09:driver-contract

  windows-native:
    name: Windows native
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:task5
      - run: cargo fmt --manifest-path native/src-tauri/Cargo.toml -- --check

  ec08-real:
    name: EC-08 real boundary
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: pnpm
      - name: Install plugin dependencies
        run: pnpm install --frozen-lockfile
      - name: Build plugin package
        run: pnpm build

      # Pin the exact DeepSeek Harness release family declared by this plugin's
      # peer/dev dependencies. This validates the supported target first; latest
      # master compatibility is a separate forward-compatibility concern.
      - name: Checkout DeepSeek Harness 0.1.1-rc.2
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: b150a551b8d465e31e418e1b2eaf5e79bbb7d28e
          path: .ec08/deepseek-harness
          fetch-depth: 1
      - name: Install DeepSeek Harness dependencies
        shell: pwsh
        working-directory: .ec08/deepseek-harness
        run: pnpm install --frozen-lockfile
      - name: Build DeepSeek Harness
        shell: pwsh
        working-directory: .ec08/deepseek-harness
        run: pnpm run build
      - name: Run EC-08 real Session-to-model boundary
        shell: pwsh
        env:
          R07_DSH_REPOSITORY: ${{ github.workspace }}\.ec08\deepseek-harness
          EC08_ARTIFACT_ROOT: ${{ runner.temp }}\ec08-artifacts
        run: pnpm test:ec08:session-model-boundary
      - name: Upload EC-08 privacy-safe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ec08-session-model-boundary-${{ github.run_id }}
          path: ${{ runner.temp }}\ec08-artifacts\ec08-session-model-boundary.json
          if-no-files-found: warn
          retention-days: 14

  ec09-browser-real:
    name: EC-09B real browser boundary
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.97.1

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile
      - name: Build plugin package
        run: pnpm build
      - name: Build browser extension
        run: pnpm browser:build
      # tauri::generate_context! validates frontendDist even for the standalone
      # native-host binary, so create native/dist before Cargo compiles the host.
      - name: Build Tauri frontend assets
        run: pnpm --dir native build
      - name: Build Windows native messaging host
        run: pnpm native:host:build
      - name: Install Playwright Chromium
        run: pnpm --dir browser-extension exec playwright install chromium

      - name: Checkout DeepSeek Harness 0.1.1-rc.2
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: b150a551b8d465e31e418e1b2eaf5e79bbb7d28e
          path: .ec09/deepseek-harness
          fetch-depth: 1
      - name: Install DeepSeek Harness dependencies
        shell: pwsh
        working-directory: .ec09/deepseek-harness
        run: pnpm install --frozen-lockfile
      - name: Build DeepSeek Harness
        shell: pwsh
        working-directory: .ec09/deepseek-harness
        run: pnpm run build

      # This is a real Chromium + MV3 extension + Windows Native Messaging Host
      # boundary. The runner creates an actual DOM Range selection, lets the
      # content/background scripts deliver it, and verifies it through the live
      # Protocol V4 Harness pipe with selection.current.
      - name: Run EC-09B real browser native-pipe boundary
        shell: pwsh
        env:
          R07_DSH_REPOSITORY: ${{ github.workspace }}\.ec09\deepseek-harness
          EC09_BROWSER_ARTIFACT_ROOT: ${{ runner.temp }}\ec09-browser-artifacts
        run: pnpm test:ec09:browser-native-pipe
      - name: Upload EC-09B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ec09-browser-native-pipe-${{ github.run_id }}
          path: |
            ${{ runner.temp }}\ec09-browser-artifacts\ec09-browser-native-pipe.json
            ${{ runner.temp }}\ec09-browser-artifacts\browser-selection.png
          if-no-files-found: warn
          retention-days: 14

  ec09-tauri-real:
    name: EC-09C real Tauri Lens boundary
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.97.1

      - name: Install project dependencies
        run: pnpm install --frozen-lockfile
      - name: Build plugin package
        run: pnpm build
      - name: Build browser extension
        run: pnpm browser:build
      - name: Build debug Tauri application
        shell: pwsh
        run: pnpm --dir native exec tauri build --debug --no-bundle
      - name: Build Windows native messaging host
        run: pnpm native:host:build
      - name: Install Playwright Chromium
        run: pnpm --dir browser-extension exec playwright install chromium

      # Tauri's direct WebDriver route on Windows proxies through the native
      # Microsoft Edge WebDriver. Keep it synchronized with the hosted runner's
      # Edge/WebView2 installation before starting tauri-driver.
      - name: Install matching Microsoft Edge Driver
        shell: pwsh
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"
          $PWD.Path >> $env:GITHUB_PATH
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Checkout DeepSeek Harness 0.1.1-rc.2
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: b150a551b8d465e31e418e1b2eaf5e79bbb7d28e
          path: .ec09c/deepseek-harness
          fetch-depth: 1
      - name: Install DeepSeek Harness dependencies
        shell: pwsh
        working-directory: .ec09c/deepseek-harness
        run: pnpm install --frozen-lockfile
      - name: Build DeepSeek Harness
        shell: pwsh
        working-directory: .ec09c/deepseek-harness
        run: pnpm run build

      # Final core acceptance: a real Chromium selection reaches Harness, a real
      # Tauri WebView2 Lens explicitly authorizes section context, the material
      # remains bound to the authorized snapshot, and the same request reaches
      # the real Session/Agent/model boundary and durable history.
      - name: Run EC-09C real Tauri Lens authorization boundary
        shell: pwsh
        env:
          R07_DSH_REPOSITORY: ${{ github.workspace }}\.ec09c\deepseek-harness
          DSH_LENS_REPORT_PATH: ${{ runner.temp }}\ec09-tauri-artifacts\ec09-tauri-lens-driver.json
          DSH_LENS_SCREENSHOT_DIR: ${{ runner.temp }}\ec09-tauri-artifacts\screenshots
        run: pnpm test:ec09:tauri-lens
      - name: Upload EC-09C evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ec09-tauri-lens-${{ github.run_id }}
          path: |
            ${{ runner.temp }}\ec09-tauri-artifacts\ec09-tauri-lens-driver.json
            ${{ runner.temp }}\ec09-tauri-artifacts\screenshots\*.png
          if-no-files-found: warn
          retention-days: 14
