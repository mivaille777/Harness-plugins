name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/t05-session-integration

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:ec07:model-boundary:unit
      - run: pnpm test:ec08:session-model-boundary:unit
      - run: pnpm test:ec09:driver-contract

  windows-native:
    name: Windows native
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:task5
      - run: cargo fmt --manifest-path native/src-tauri/Cargo.toml -- --check

  ec08-real:
    name: EC-08 real boundary
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: pnpm
      - name: Install plugin dependencies
        run: pnpm install --frozen-lockfile
      - name: Build plugin package
        run: pnpm build

      # Run the plugin against the actual DeepSeek Harness CLI source, a real
      # Protocol V4 named pipe, a real Harness Session, and a deterministic local
      # OpenAI-compatible model endpoint. No external model credential is used.
      - name: Checkout DeepSeek Harness
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: master
          path: .ec08/deepseek-harness
          fetch-depth: 1
      - name: Install DeepSeek Harness dependencies
        shell: pwsh
        working-directory: .ec08/deepseek-harness
        run: pnpm install --frozen-lockfile
      - name: Run EC-08 real Session-to-model boundary
        shell: pwsh
        env:
          R07_DSH_REPOSITORY: ${{ github.workspace }}\.ec08\deepseek-harness
          EC08_ARTIFACT_ROOT: ${{ runner.temp }}\ec08-artifacts
        run: pnpm test:ec08:session-model-boundary
      - name: Upload EC-08 privacy-safe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ec08-session-model-boundary-${{ github.run_id }}
          path: ${{ runner.temp }}\ec08-artifacts\ec08-session-model-boundary.json
          if-no-files-found: warn
          retention-days: 14
