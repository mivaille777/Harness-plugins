name: One-shot rustfmt fixer

on:
  push:
    branches:
      - feat/t05-session-integration
    paths:
      - 'native/src-tauri/**/*.rs'
      - '.github/workflows/rustfmt-fix.yml'

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/t05-session-integration
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - name: Format Rust sources
        run: cargo fmt --manifest-path native/src-tauri/Cargo.toml
      - name: Commit rustfmt-only changes
        shell: bash
        run: |
          if git diff --quiet -- native/src-tauri; then
            echo 'No rustfmt changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/src-tauri
          git commit -m 'style(rust): apply rustfmt'
          git push origin HEAD:feat/t05-session-integration
